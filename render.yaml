services:
  - type: web
    name: clinavio-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DEMO_MODE
        value: "true"
      - key: VITE_DEMO_MODE
        value: "true"
